<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI-GUARD | Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #ffffff,
                    #f5f3ff
                );
        }

        .login-card {

            width: 90%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(15, 23, 42, 0.12);

            text-align: center;
        }

        .logo {

            font-size: 30px;

            font-weight: bold;

            color: #172554;

            margin-bottom: 10px;
        }

        .title {

            font-size: 26px;

            color: #1e293b;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #64748b;

            margin-bottom: 25px;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 2px solid #e2e8f0;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        input:focus {

            border-color: #2563eb;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;
        }

        .signup-link {

            margin-top: 20px;

            color: #64748b;
        }

        .signup-link a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="login-card">

        <div class="logo">
            🛡️ AI-GUARD
        </div>

        <h1 class="title">
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to your AI-GUARD account
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                🔑 Login
            </button>

        </form>


        <div class="signup-link">

            Don't have an account?

            <a href="/signup/">
                Create Account
            </a>

        </div>

    </div>

</body>

</html>
